# Apache2 virtual host for status.piuskl.me (Uptime Kuma status page)
#
# Installed by deploy/status/setup-status.sh, which also enables:
#   proxy proxy_http proxy_wstunnel rewrite headers ssl
# Kept out of deploy/apache/ so the GitHub deploy doesn't enable it before
# those modules exist.

<VirtualHost *:80>
    ServerName status.piuskl.me
    Redirect permanent / https://status.piuskl.me/

    ErrorLog  ${APACHE_LOG_DIR}/status.piuskl.me-error.log
    CustomLog ${APACHE_LOG_DIR}/status.piuskl.me-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName status.piuskl.me

    # Same ZeroSSL wildcard certificate as shop.piuskl.me (*.piuskl.me)
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/shop.piuskl.me.crt
    SSLCertificateKeyFile /etc/ssl/private/shop.piuskl.me.key

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # Reverse proxy to the Uptime Kuma container on localhost:3001
    ProxyRequests     Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Uptime Kuma's dashboard updates live over WebSockets
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade}    websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade   [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3001/$1 [P,L]

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/status.piuskl.me-error.log
    CustomLog ${APACHE_LOG_DIR}/status.piuskl.me-access.log combined
</VirtualHost>
</IfModule>
